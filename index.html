</style><header><small>Idox Training</small><h1>Enterprise Automation &amp; Intelligence</h1><p>Learning Check · Put it into practice</p></header><main class="shell"><div id="app" class="card"></div><div class="footer">Build 1.6</div></main><script>
const activities=[{"type": "gap", "topic": "Auto emails", "title": "What is the sweep clause for?", "text": ["A sweep clause selects records that ", " and checks that the intended recipient has ", "."], "tokens": ["Reached their scheduled run time", "A suitable email address", "Already received the email", "Meet the conditions for sending the email"], "answers": [3, 1], "explanation": "The sweep clause filters records using the conditions for sending the email, including the intended recipient and suitable email address. The schedule controls when the process runs."}, {"type": "gap", "topic": "Auto emails", "title": "Choose the level", "text": ["To send an email once per qualifying inspection, run the task at ", " level. To send it once per qualifying case, run it at ", " level."], "tokens": ["Case", "Inspection"], "answers": [1, 0], "explanation": "With one email generated per qualifying record, inspection level produces an email for each selected inspection; case level produces an email for each selected case."}, {"question": "The email code checks AETASK for the current record and the correct Task Definition ID. It finds an existing matching record. What happens?", "options": ["Send the email again", "Do not send the email again", "The process errors"], "correct": 1, "explanation": "The configured exclusion checks for an existing matching AETASK record for the case and task definition. A match prevents this email being selected again.", "type": "choice", "topic": "Auto emails", "title": "Prevent a repeat email"}, {"type": "choice", "topic": "Email content", "title": "Spot the missing +", "question": "This line has a missing +. Where should it go?", "snippet": "string emailbody = \"<p>Your reference is \" Ref + \"</p>\";", "options": ["Between the first quoted text and Ref", "Between Ref and the existing +", "After the semicolon"], "correct": 0, "explanation": "Place + between the first quoted text and Ref: \"<p>Your reference is \" + Ref + \"</p>\". The + signs join the quoted text and the string value."}, {"question": "Your CoreComms report previews correctly, but its scheduled email never arrives. Which setting should you check first?", "options": ["Calculated fields exist", "Output is enabled", "Query returns data", "Security tags"], "correct": 1, "explanation": "Previewing only confirms that the query works. For emails to send automatically, the Output section must be configured and the Enabled box ticked. Otherwise the report will not generate email output.", "type": "choice", "topic": "CoreComms", "title": "Why has the report not emailed?"}, {"type": "match", "topic": "CoreComms", "title": "Which CoreComms feature would you use?", "scenario": "Match each practical requirement to the feature you would use.", "tokens": ["Output", "Query Builder", "Calculated Fields"], "labels": ["Show only open cases allocated to a particular officer", "Show working days between receipt and closure", "Email the report to the team manager"], "answers": [1, 2, 0], "explanation": "Query Builder filters the records. Calculated Fields add values such as working days between dates. Output configures email delivery to the recipient."}, {"question": "Month is blank, Day is 1 and 15, Hour is 7 and Minute is 0. When does the schedule run?", "options": ["Manually only", "1 Jan and 15 Jan only", "1st and 15th of every month at 7am", "Every day at 7am"], "correct": 2, "explanation": "Leaving Month blank acts as a wildcard, meaning every month. Combined with Day 1 and 15 and Hour 7, the task runs at 7am on the 1st and 15th of every month.", "type": "choice", "topic": "Core Services", "title": "Read the schedule"}];
let current=0,selected=null;let states=activities.map(a=>({values:[],attempts:0,done:false,firstCorrect:false,revealed:false,message:''}));
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iconPaths={filter:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',case:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v3h4v-3"/>',inspection:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 13l3 3 5-6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18M7 14h2M12 14h2M7 18h2"/>',repeat:'<path d="M20 7h-4l2-3M20 7a8 8 0 0 0-14-2M4 17h4l-2 3M4 17a8 8 0 0 0 14 2"/>',code:'<path d="m8 5-6 7 6 7M16 5l6 7-6 7M14 3l-4 18"/>',paragraph:'<path d="M15 21V3H9a5 5 0 0 0 0 10h6M19 3v18M12 3v18"/>',bold:'<path d="M7 3h6a4 4 0 0 1 0 8H7zM7 11h7a5 5 0 0 1 0 10H7z"/>',italic:'<path d="M10 3h10M4 21h10M15 3 9 21"/>'};
function icon(k){return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+iconPaths[k]+'</svg>';}
function tokenIcon(t){return ({'Meet the conditions for sending the email':'filter','A suitable email address':'mail','Reached their scheduled run time':'clock','Already received the email':'mail',Output:'mail','Query Builder':'filter','Calculated Fields':'calendar',which:'filter',when:'clock',Case:'case',Inspection:'inspection','<p>':'paragraph','<strong>':'bold','<em>':'italic','Fixed dates':'calendar','Every X minutes':'clock','Fixed times':'clock',Continuously:'repeat'})[t]||'code';}
function activityIcon(a){return a.topic==='Email content'?'code':a.topic==='Core Services'?'clock':a.topic==='CoreComms'?'mail':a.title==='Choose the level'?'inspection':'filter';}

function intro(){app.innerHTML='<div class="eyebrow">7 varied activities · Work at your own pace</div><div class="intro-icons" aria-hidden="true">'+icon('filter')+icon('mail')+icon('clock')+' </div><h2>Put your learning into practice</h2><p>Complete sentences, match answers, investigate short scenarios covering auto emails, CoreComms and Core Services.</p><p>Drag an answer into place, or click an answer and then its destination. You can also use Tab and Enter. Click a filled answer to return it.</p><p>Check each answer for feedback. You can try again or reveal the explanation.</p><button class="primary" onclick="render()">Start learning check</button>';}
function token(i,placed=false){const a=activities[current],s=states[current];return '<button class="token '+(a.type==='code'?'code-piece ':'')+(placed?'placed ':'')+(selected===i?'selected':'')+'" '+(s.done?'disabled':'draggable="true"')+' data-token="'+i+'" aria-pressed="'+(selected===i)+'" onclick="pick('+i+')">'+icon(a.type==='code'?'code':tokenIcon(a.tokens[i]))+'<span>'+esc(a.tokens[i])+'</span></button>';}
function render(){selected=null;draw();app.classList.remove('activity-enter','answer-success');void app.offsetWidth;app.classList.add('activity-enter');}
function draw(){const a=activities[current],s=states[current];let body='';
if(a.type==='choice'){body='<p>'+esc(a.question)+'</p>'+(a.snippet?'<pre class="code-question"><code>'+esc(a.snippet)+'</code></pre>':'')+a.options.map((o,i)=>'<button class="option '+(s.values[0]===i?'selected':'')+'" '+(s.done?'disabled':'')+' onclick="choose('+i+')">'+esc(o.replace(/&lt;/g,'<').replace(/&gt;/g,'>'))+'</button>').join('');}
else{body='<p class="hint">'+(s.done?'Activity complete.':'Drag answers, or select an answer and then a destination. Click a placed answer to return it.')+'</p>';
if(a.scenario)body+='<p>'+esc(a.scenario)+'</p>';
body+='<div class="bank" aria-label="Answer bank">'+a.tokens.map((t,i)=>(a.type==='sort'?s.values[i]!==undefined:s.values.includes(i))?'':token(i)).join('')+'</div>';
if((a.type==='gap'||a.type==='code')){body+='<div class="sentence '+(a.type==='code'?'code-assembly':'')+'">'+a.text.map((t,i)=>esc(t)+(i<a.answers.length?'<button class="gap" data-target="'+i+'" '+(s.done?'disabled':'')+' onclick="place('+i+')">'+(s.values[i]===undefined?'Gap '+(i+1):icon(a.type==='code'?'code':tokenIcon(a.tokens[s.values[i]]))+'<span>'+esc(a.tokens[s.values[i]])+'</span>')+'</button>':'')).join('')+'</div>';}
else{body+='<div class="targets '+(a.type==='sort'?'sort':'')+'">'+a.labels.map((l,j)=>'<div class="target" data-target="'+j+'"><button '+(s.done?'disabled':'')+' onclick="place('+j+')">'+esc(l)+' <span class="hint">'+(a.type==='sort'?'· Place here':'· '+(s.values[j]===undefined?'Place here':icon(tokenIcon(a.tokens[s.values[j]]))+'<span>'+esc(a.tokens[s.values[j]])+'</span>'))+'</span></button>'+(a.type==='sort'?a.tokens.map((t,i)=>s.values[i]===j?token(i,true):'').join(''):'')+'</div>').join('')+'</div>';}}
app.innerHTML='<div class="row"><span class="eyebrow">Activity '+(current+1)+' of '+activities.length+' · '+esc(a.topic)+'</span><span class="eyebrow">'+({gap:'Complete the sentence',sort:'Sort the records',match:'Match the answers',choice:'Choose an answer',code:'Assemble the code'}[a.type])+'</span></div><div class="bar"><span style="width:'+states.filter(x=>x.done).length/activities.length*100+'%"></span></div><div class="activity-heading"><div class="topic-icon">'+icon(activityIcon(a))+'</div><h2>'+esc(a.title)+'</h2></div>'+body+'<div id="feedback" role="status" aria-live="polite">'+(s.message?'<div class="feedback '+(s.done?'good':'retry')+'">'+esc(s.message)+'</div>':'')+'</div><div class="row" style="margin-top:25px"><button onclick="back()" '+(current===0?'disabled':'')+'>Previous</button><div class="row">'+(!s.done?'<button onclick="resetAnswer()">Clear</button><button onclick="reveal()">Reveal answer</button><button class="primary" onclick="check()">Check answer</button>':'<button class="primary" onclick="next()">'+(current===activities.length-1?'See results':'Next activity')+'</button>')+'</div></div>';
app.querySelectorAll('[data-token]').forEach(e=>e.addEventListener('dragstart',ev=>{selected=Number(e.dataset.token);ev.dataTransfer.setData('text/plain',e.dataset.token);ev.dataTransfer.effectAllowed='move';}));
app.querySelectorAll('[data-target]').forEach(e=>{e.addEventListener('dragover',ev=>{if(!s.done){ev.preventDefault();e.classList.add('over');}});e.addEventListener('dragleave',()=>e.classList.remove('over'));e.addEventListener('drop',ev=>{ev.preventDefault();if(s.done)return;const id=Number(ev.dataTransfer.getData('text/plain'));if(Number.isInteger(id)&&id>=0&&id<a.tokens.length){selected=id;place(Number(e.dataset.target));}});});}
function choose(i){const s=states[current];if(s.done)return;s.values=[i];s.message='';draw();}
function pick(i){const a=activities[current],s=states[current];if(s.done)return;if(a.type==='sort'&&s.values[i]!==undefined){delete s.values[i];selected=null;}else if(a.type!=='sort'&&s.values.includes(i)){delete s.values[s.values.indexOf(i)];selected=null;}else selected=selected===i?null:i;s.message='';draw();}
function place(j){const a=activities[current],s=states[current];if(s.done)return;if(selected===null){if(a.type!=='sort'){delete s.values[j];draw();}return;}if(a.type==='sort')s.values[selected]=j;else{const old=s.values.indexOf(selected);if(old>=0)delete s.values[old];s.values[j]=selected;}selected=null;s.message='';draw();}
function complete(){const a=activities[current],s=states[current];return a.type==='choice'?s.values[0]!==undefined:a.answers.every((_,i)=>s.values[i]!==undefined);}
function check(){const a=activities[current],s=states[current];if(s.done)return;if(!complete()){s.message='Place all required answers before checking.';draw();return;}s.attempts++;const ok=a.type==='choice'?s.values[0]===a.correct:a.answers.every((v,i)=>a.type==='code'?a.tokens[s.values[i]]===a.tokens[v]:s.values[i]===v);if(ok){s.done=true;s.firstCorrect=s.attempts===1;s.message='✓ Correct.';}else s.message='Not quite. '+a.explanation+' You can adjust your answers and try again.';draw();if(ok){app.classList.remove('answer-success');void app.offsetWidth;app.classList.add('answer-success');}}
function reveal(){const a=activities[current],s=states[current];if(s.done)return;s.values=a.type==='choice'?[a.correct]:[...a.answers];s.done=true;s.revealed=true;s.message='Answer revealed. '+a.explanation;selected=null;draw();}
function resetAnswer(){const s=states[current];if(s.done)return;s.values=[];s.message='';selected=null;draw();}
function back(){if(current>0){current--;render();}}
function next(){if(!states[current].done)return;if(current<activities.length-1){current++;render();}else results();}
function results(){
const correct=states.filter(s=>s.firstCorrect).length;
app.innerHTML='<div class="celebration"><canvas id="fireworks" aria-hidden="true"></canvas><div class="celebration-content"><div class="eyebrow">Learning check complete</div><div class="finish-mark" aria-hidden="true">✓</div><h2>Congratulations!</h2><p class="completed">You’ve completed<br>Enterprise Automation &amp; Intelligence.</p><div class="score">'+correct+' / '+activities.length+'</div><p class="hint">Correct on your first checked attempt</p><p>Thank you for attending Idox training.</p><button class="primary" onclick="restart()">Try again</button></div></div>';
celebrate();
}
let fireworkFrame=null;
function celebrate(){
if(fireworkFrame!==null)cancelAnimationFrame(fireworkFrame);
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const canvas=document.getElementById('fireworks'),box=canvas.parentElement;
const width=box.clientWidth,height=box.clientHeight,ratio=Math.min(window.devicePixelRatio||1,2);
canvas.width=width*ratio;canvas.height=height*ratio;
const ctx=canvas.getContext('2d');if(!ctx)return;ctx.scale(ratio,ratio);
const colours=['#e3ac35','#268f83','#3468aa','#c95c80','#8267af'];
const pieces=Array.from({length:130},(_,i)=>{const left=i%2===0;return{x:left?width*.1:width*.9,y:height*.76,vx:(left?1:-1)*(45+Math.random()*230),vy:-240-Math.random()*260,rotation:Math.random()*6.28,spin:(Math.random()-.5)*10,w:5+Math.random()*4,h:3+Math.random()*5,delay:Math.random()*.5,colour:colours[i%colours.length]};});
let began=null;
function frame(now){if(!canvas.isConnected){fireworkFrame=null;return;}if(began===null)began=now;const elapsed=(now-began)/1000;ctx.clearRect(0,0,width,height);
for(const p of pieces){const t=elapsed-p.delay;if(t<0)continue;const x=p.x+p.vx*(1-Math.exp(-.6*t))/.6,y=p.y+p.vy*t+105*t*t;
if(y>height+20)continue;ctx.save();ctx.translate(x,y);ctx.rotate(p.rotation+p.spin*t);ctx.globalAlpha=Math.min(1,Math.max(0,4.5-elapsed));ctx.fillStyle=p.colour;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.cos(t*7+p.rotation));ctx.restore();}
if(elapsed<4.5)fireworkFrame=requestAnimationFrame(frame);else{ctx.clearRect(0,0,width,height);fireworkFrame=null;}}
fireworkFrame=requestAnimationFrame(frame);
}
function review(i){current=i;render();}function restart(){if(fireworkFrame!==null){cancelAnimationFrame(fireworkFrame);fireworkFrame=null;}current=0;states=activities.map(a=>({values:[],attempts:0,done:false,firstCorrect:false,revealed:false,message:''}));intro();}intro();
