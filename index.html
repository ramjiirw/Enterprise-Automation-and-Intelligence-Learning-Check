<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Automation &amp; Intelligence | Learning Check</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#22334b;font:17px/1.6 'Segoe UI',Tahoma,sans-serif}button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #b8c8dc;padding:10px 17px;background:white;color:#193b67}button:hover:not(:disabled){background:#eaf2ff;border-color:#285ea4}button:focus-visible{outline:3px solid #e49a21;outline-offset:3px}button:disabled{cursor:default;opacity:.6}header{background:#17375f;color:white;padding:35px max(24px,calc((100% - 980px)/2))}header small{letter-spacing:.14em;text-transform:uppercase;color:#bcd1ec}h1{font-size:clamp(25px,4vw,36px);line-height:1.25;margin:10px 0}header p{margin:0;color:#dae5f4}.shell{max-width:980px;margin:25px auto;padding:0 20px}.card{background:white;border:1px solid #d6e0ec;border-radius:16px;padding:30px;box-shadow:0 8px 25px #17375f08}h2{font-size:25px;line-height:1.35;margin:10px 0 20px}.eyebrow{font-size:14px;color:#537094;font-weight:600}.bar{height:7px;background:#dce5ef;border-radius:8px;margin:12px 0 24px;overflow:hidden}.bar span{display:block;height:100%;background:#3e8b78}.primary{background:#24578f;color:white;border-color:#24578f}.primary:hover:not(:disabled){background:#173b65;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.bank{padding:18px;background:#eff4fa;border-radius:12px;display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.token{border:1px solid #9fb5d1;background:white;box-shadow:0 2px 3px #17375f0b}.selected{background:#17375f!important;color:white!important}.gap{display:inline-block;min-width:140px;border:2px dashed #9ab1cf;margin:6px;padding:8px 14px;vertical-align:middle}.sentence{font-size:21px;line-height:2.2;padding:15px 0}.targets{display:grid;gap:12px}.target{border:2px dashed #a2b7d0;border-radius:12px;padding:16px;min-height:85px}.target.over,.gap.over{background:#e2efff;border-color:#24578f}.target>button:first-child{width:100%;text-align:left;border:0;background:transparent;padding:0;font-weight:600}.placed{display:block;margin-top:10px;width:100%;text-align:left}.sort{grid-template-columns:1fr 1fr}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 18px}.feedback{margin:20px 0;border-radius:10px;padding:16px;background:#edf3fa}.good{background:#e8f5ee;border-left:4px solid #348765}.retry{background:#fff4e0;border-left:4px solid #b77816}.hint{font-size:15px;color:#5b6d85}.footer{font-size:13px;color:#65768b;text-align:center;margin:18px}.review{padding:15px 0;border-bottom:1px solid #dce5ef}.score{font-size:40px;color:#24578f;font-weight:700}.hidden{display:none}@media(max-width:600px){.card{padding:20px}.sort{grid-template-columns:1fr}header{padding:25px 20px}.gap{min-width:110px}.sentence{font-size:19px}}@media(prefers-reduced-motion:no-preference){.bar span{transition:width .25s}}
</style><header><small>Idox Training</small><h1>Enterprise Automation &amp; Intelligence</h1><p>Learning Check · Put it into practice</p></header><main class="shell"><div id="app" class="card"></div><div class="footer">Build 1.1</div></main><script>
const activities=[{"type":"gap","topic":"Auto emails","title":"Complete the automation sentence","text":["A sweep clause determines "," records are selected. Core Services determines "," the task runs."],"tokens":["when","which"],"answers":[1,0],"explanation":"The sweep clause selects qualifying records. The schedule controls when the task runs."},{"type":"sort","topic":"Auto emails","title":"Which records pass the filter?","scenario":"Include open cases where the contact address contains @. Sort every record using these two conditions only.","tokens":["A · Open · officer@council.gov.uk","B · Closed · officer@council.gov.uk","C · Open · Blank address","D · Open · officer@"],"labels":["Included","Excluded"],"answers":[0,1,1,0],"explanation":"A and D pass these conditions. D is not a complete email address: containing @ alone does not prove an address is valid."},{"question":"Where is automatic email activity stored for reporting?","options":["User mailbox","CoreComms output","AETASK table","EMAIL_LOG"],"correct":2,"explanation":"Each auto email creates a record in the AETASK table when it runs. This allows you to audit what was sent, when it was sent, and for which case. It is essential for reporting and tracking activity.","type":"choice","topic":"Auto emails","title":"Find the audit trail"},{"question":"A task runs once for each qualifying inspection. Three inspections qualify. How many emails does the email logic produce?","options":["No emails are sent","Three separate emails are sent","One email is sent","Two emails are sent"],"correct":1,"explanation":"When code runs from a lower level table such as Inspections or Actions, it executes once per record returned. If three inspections meet the sweep clause, the email logic runs three times, producing three separate emails.","type":"choice","topic":"Auto emails","title":"One case, three inspections"},{"type":"gap","topic":"Email content","title":"Choose the data type","text":["Names and email body text are stored in a C# ","."],"tokens":["Boolean","String","Integer"],"answers":[1],"explanation":"A String stores text. A Boolean stores true or false, and an Integer stores a whole number."},{"question":"An auto email is configured to exclude cases with a matching AETASK record for this TASKDEFID. A matching record is found. What happens?","options":["The email is sent again","The email is not sent again","The process errors","A duplicate email is sent"],"correct":1,"explanation":"The configured exclusion checks for an existing matching AETASK record for the case and task definition. A match prevents this email being selected again.","type":"choice","topic":"Auto emails","title":"Prevent a repeat email"},{"type":"match","topic":"Email content","title":"Match the HTML tags","tokens":["<em>","<p>","<strong>"],"labels":["Creates a paragraph","Marks important text, normally bold","Marks emphasis, normally italic"],"answers":[1,2,0],"explanation":"<p> creates a paragraph; <strong> marks importance and usually appears bold; <em> marks emphasis and usually appears italic."},{"type":"gap","topic":"Email content","title":"Complete the email layout","text":["Use "," for a separate paragraph and "," to mark important text, normally shown in bold."],"tokens":["<strong>","<p>","<em>"],"answers":[1,0],"explanation":"Paragraphs separate the message into readable blocks. Strong marks important information."},{"question":"Which CoreComms feature allows working-day calculations?","options":["Output settings","Calculated Fields","Query Builder","Field naming"],"correct":1,"explanation":"Calculated Fields allow you to derive new values from existing data, such as calculating working days between two dates. This avoids exporting data elsewhere for manual calculation.","type":"choice","topic":"CoreComms","title":"Calculate working days"},{"question":"Your CoreComms report previews correctly, but its scheduled email never arrives. Which setting should you check first?","options":["Calculated fields exist","Output is enabled","Query returns data","Security tags"],"correct":1,"explanation":"Previewing only confirms that the query works. For emails to send automatically, the Output section must be configured and the Enabled box ticked. Otherwise the report will not generate email output.","type":"choice","topic":"CoreComms","title":"Why has the report not emailed?"},{"type":"match","topic":"Core Services","title":"Match the scheduling approaches","tokens":["Fixed dates","Every X minutes","Fixed times","Continuously"],"labels":["Repeated interval","Specified times","Specified dates","Continuous processing"],"answers":[1,2,0,3],"explanation":"Core Services offers continuous, interval, fixed time and fixed date scheduling."},{"question":"Month is blank, Day is 1 and 15, Hour is 7 and Minute is 0. When does the schedule run?","options":["Manually only","1 Jan and 15 Jan only","1st and 15th of every month at 7am","Every day at 7am"],"correct":2,"explanation":"Leaving Month blank acts as a wildcard, meaning every month. Combined with Day 1 and 15 and Hour 7, the task runs at 7am on the 1st and 15th of every month.","type":"choice","topic":"Core Services","title":"Read the schedule"},{"type":"gap","topic":"Core Services","title":"Make sense of the icons","text":["The "," explains the meaning of the service status icons."],"tokens":["Query Builder","Job Status Key","Calculated Fields"],"answers":[1],"explanation":"Use the Job Status Key to interpret the icons shown for service jobs."},{"question":"A task shows an error icon. What does this mean?","options":["Task disabled","Task successful","Task ran but failed","Task not run"],"correct":2,"explanation":"An error icon means the task attempted to run but encountered a failure. This usually requires checking logs or configuration settings to identify and resolve the issue.","type":"choice","topic":"Core Services","title":"Investigate the failed job"}];
let current=0,selected=null;let states=activities.map(a=>({values:[],attempts:0,done:false,firstCorrect:false,revealed:false,message:''}));
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function intro(){app.innerHTML='<div class="eyebrow">14 varied activities · Work at your own pace</div><h2>Put your learning into practice</h2><p>Complete sentences, match answers, sort records and investigate short scenarios covering auto emails, CoreComms and Core Services.</p><p>Drag an answer into place, or click an answer and then its destination. You can also use Tab and Enter. Click a filled answer to return it.</p><p>Check each answer for feedback. You can try again or reveal the explanation.</p><button class="primary" onclick="render()">Start learning check</button>';}
function token(i,placed=false){const a=activities[current],s=states[current];return '<button class="token '+(placed?'placed ':'')+(selected===i?'selected':'')+'" '+(s.done?'disabled':'draggable="true"')+' data-token="'+i+'" aria-pressed="'+(selected===i)+'" onclick="pick('+i+')">'+esc(a.tokens[i])+'</button>';}
function render(){selected=null;draw();}
function draw(){const a=activities[current],s=states[current];let body='';
if(a.type==='choice'){body='<p>'+esc(a.question)+'</p>'+a.options.map((o,i)=>'<button class="option '+(s.values[0]===i?'selected':'')+'" '+(s.done?'disabled':'')+' onclick="choose('+i+')">'+esc(o.replace(/&lt;/g,'<').replace(/&gt;/g,'>'))+'</button>').join('');}
else{body='<p class="hint">'+(s.done?'Activity complete.':'Drag answers, or select an answer and then a destination. Click a placed answer to return it.')+'</p>';
if(a.scenario)body+='<p>'+esc(a.scenario)+'</p>';
body+='<div class="bank" aria-label="Answer bank">'+a.tokens.map((t,i)=>(a.type==='sort'?s.values[i]!==undefined:s.values.includes(i))?'':token(i)).join('')+'</div>';
if(a.type==='gap'){body+='<div class="sentence">'+a.text.map((t,i)=>esc(t)+(i<a.answers.length?'<button class="gap" data-target="'+i+'" '+(s.done?'disabled':'')+' onclick="place('+i+')">'+(s.values[i]===undefined?'Gap '+(i+1):esc(a.tokens[s.values[i]]))+'</button>':'')).join('')+'</div>';}
else{body+='<div class="targets '+(a.type==='sort'?'sort':'')+'">'+a.labels.map((l,j)=>'<div class="target" data-target="'+j+'"><button '+(s.done?'disabled':'')+' onclick="place('+j+')">'+esc(l)+' <span class="hint">'+(a.type==='sort'?'· Place here':'· '+(s.values[j]===undefined?'Place here':esc(a.tokens[s.values[j]])))+'</span></button>'+(a.type==='sort'?a.tokens.map((t,i)=>s.values[i]===j?token(i,true):'').join(''):'')+'</div>').join('')+'</div>';}}
app.innerHTML='<div class="row"><span class="eyebrow">Activity '+(current+1)+' of '+activities.length+' · '+esc(a.topic)+'</span><span class="eyebrow">'+({gap:'Complete the sentence',sort:'Sort the records',match:'Match the answers',choice:'Choose an answer'}[a.type])+'</span></div><div class="bar"><span style="width:'+states.filter(x=>x.done).length/activities.length*100+'%"></span></div><h2>'+esc(a.title)+'</h2>'+body+'<div id="feedback" role="status" aria-live="polite">'+(s.message?'<div class="feedback '+(s.done?'good':'retry')+'">'+esc(s.message)+'</div>':'')+'</div><div class="row" style="margin-top:25px"><button onclick="back()" '+(current===0?'disabled':'')+'>Previous</button><div class="row">'+(!s.done?'<button onclick="resetAnswer()">Clear</button><button onclick="reveal()">Reveal answer</button><button class="primary" onclick="check()">Check answer</button>':'<button class="primary" onclick="next()">'+(current===activities.length-1?'See results':'Next activity')+'</button>')+'</div></div>';
app.querySelectorAll('[data-token]').forEach(e=>e.addEventListener('dragstart',ev=>{selected=Number(e.dataset.token);ev.dataTransfer.setData('text/plain',e.dataset.token);ev.dataTransfer.effectAllowed='move';}));
app.querySelectorAll('[data-target]').forEach(e=>{e.addEventListener('dragover',ev=>{if(!s.done){ev.preventDefault();e.classList.add('over');}});e.addEventListener('dragleave',()=>e.classList.remove('over'));e.addEventListener('drop',ev=>{ev.preventDefault();if(s.done)return;const id=Number(ev.dataTransfer.getData('text/plain'));if(Number.isInteger(id)&&id>=0&&id<a.tokens.length){selected=id;place(Number(e.dataset.target));}});});}
function choose(i){const s=states[current];if(s.done)return;s.values=[i];s.message='';draw();}
function pick(i){const a=activities[current],s=states[current];if(s.done)return;if(a.type==='sort'&&s.values[i]!==undefined){delete s.values[i];selected=null;}else if(a.type!=='sort'&&s.values.includes(i)){delete s.values[s.values.indexOf(i)];selected=null;}else selected=selected===i?null:i;s.message='';draw();}
function place(j){const a=activities[current],s=states[current];if(s.done)return;if(selected===null){if(a.type!=='sort'){delete s.values[j];draw();}return;}if(a.type==='sort')s.values[selected]=j;else{const old=s.values.indexOf(selected);if(old>=0)delete s.values[old];s.values[j]=selected;}selected=null;s.message='';draw();}
function complete(){const a=activities[current],s=states[current];return a.type==='choice'?s.values[0]!==undefined:a.answers.every((_,i)=>s.values[i]!==undefined);}
function check(){const a=activities[current],s=states[current];if(s.done)return;if(!complete()){s.message='Place all required answers before checking.';draw();return;}s.attempts++;const ok=a.type==='choice'?s.values[0]===a.correct:a.answers.every((v,i)=>s.values[i]===v);if(ok){s.done=true;s.firstCorrect=s.attempts===1;s.message='Correct. '+a.explanation;}else s.message='Not quite. Review your choices and try again, or reveal the answer.';draw();}
function reveal(){const a=activities[current],s=states[current];if(s.done)return;s.values=a.type==='choice'?[a.correct]:[...a.answers];s.done=true;s.revealed=true;s.message='Answer revealed. '+a.explanation;selected=null;draw();}
function resetAnswer(){const s=states[current];if(s.done)return;s.values=[];s.message='';selected=null;draw();}
function back(){if(current>0){current--;render();}}
function next(){if(!states[current].done)return;if(current<activities.length-1){current++;render();}else results();}
function results(){app.innerHTML='<div class="eyebrow">Learning check complete</div><h2>Enterprise Automation &amp; Intelligence</h2><div class="score">'+states.filter(s=>s.firstCorrect).length+' / '+activities.length+'</div><p>Correct on your first checked attempt. '+states.filter(s=>s.revealed).length+' answers revealed.</p><p>Use the review below to revisit any topics. This is a learning check, so there is no pass mark.</p>'+activities.map((a,i)=>'<div class="review row"><div><strong>'+esc(a.title)+'</strong><br><span class="hint">'+(states[i].revealed?'Answer revealed':states[i].firstCorrect?'Correct first time':'Completed after another attempt')+'</span></div><button onclick="review('+i+')">Review</button></div>').join('')+'<p>Thank you for attending Idox training.</p><button class="primary" onclick="restart()">Start again</button>';}
function review(i){current=i;render();}function restart(){current=0;states=activities.map(a=>({values:[],attempts:0,done:false,firstCorrect:false,revealed:false,message:''}));intro();}intro();
</script></html>
